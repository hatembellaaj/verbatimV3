# DORIA Profiler — orchestration Docker
# Trois profils :
#   docker compose --profile dev up                  → hot-reload sur http://localhost:5174
#   docker compose --profile prod up --build         → web (nginx) + api (proxy Node)
#                                                       sur http://localhost:${WEB_PORT:-8080}
#
# Variables d'env attendues (.env à la racine, ou shell) :
#   ANTHROPIC_API_KEY=sk-ant-...   (obligatoire pour le profil prod, lu par le proxy)
#   WEB_PORT=8080                  (optionnel, défaut 8080 — port public du frontend)

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Service DEV — Vite avec hot-reload, code source monté en volume
  # ─────────────────────────────────────────────────────────────────────────
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: doria-profiler-dev
    ports:
      - "5174:5174"
    env_file:
      - .env.local
    volumes:
      - .:/app
      # Volume anonyme pour conserver le node_modules du container
      # (sinon le bind-mount écraserait le node_modules installé dans l'image)
      - /app/node_modules
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Service API — proxy Node Express qui détient la clé Anthropic
  # Pas exposé publiquement : seul `web` y accède via le réseau Docker interne.
  # ─────────────────────────────────────────────────────────────────────────
  api:
    profiles: ["prod"]
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: doria-profiler-api
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: "3001"
    expose:
      - "3001"
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Service WEB — bundle Vite servi par nginx, route /api/ vers le service api
  # ─────────────────────────────────────────────────────────────────────────
  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doria-profiler-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
