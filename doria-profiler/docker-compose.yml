# DORIA Profiler — orchestration Docker
# Deux services activables via profiles :
#   docker compose --profile dev up      → hot-reload sur http://localhost:5174
#   docker compose --profile prod up     → build prod servi par nginx sur http://localhost:8080

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Service DEV — Vite avec hot-reload, code source monté en volume
  # ─────────────────────────────────────────────────────────────────────────
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: doria-profiler-dev
    ports:
      - "5174:5174"
    env_file:
      - .env.local
    volumes:
      - .:/app
      # Volume anonyme pour conserver le node_modules du container
      # (sinon le bind-mount écraserait le node_modules installé dans l'image)
      - /app/node_modules
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Service PROD — bundle Vite servi par nginx
  # La clé API est figée dans le bundle JS au moment du build.
  # ─────────────────────────────────────────────────────────────────────────
  prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ANTHROPIC_API_KEY: ${VITE_ANTHROPIC_API_KEY:-}
    container_name: doria-profiler-prod
    ports:
      - "8080:80"
    restart: unless-stopped
