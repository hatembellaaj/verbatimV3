# DORIA Profiler — orchestration Docker
# Trois profils :
#   docker compose --profile dev up                  → hot-reload sur http://localhost:5174
#   docker compose --profile prod up --build         → web (nginx) + api (proxy Node)
#                                                       sur http://localhost:${WEB_PORT:-8080}
#
# Variables d'env attendues (.env à la racine, ou shell) :
#   ANTHROPIC_API_KEY=sk-ant-...   (obligatoire pour le profil prod, lu par le proxy)
#   WEB_PORT=8080                  (optionnel, défaut 8080 — port public du frontend)

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Service DEV — Vite avec hot-reload, code source monté en volume
  # ─────────────────────────────────────────────────────────────────────────
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: doria-profiler-dev
    ports:
      - "5174:5174"
    env_file:
      - .env.local
    volumes:
      - .:/app
      # Volume anonyme pour conserver le node_modules du container
      # (sinon le bind-mount écraserait le node_modules installé dans l'image)
      - /app/node_modules
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Service DB — PostgreSQL 16 + pgvector (image officielle pgvector/pgvector).
  # Volume persistant `db_data` pour les données. Healthcheck pour gating de `api`.
  # ─────────────────────────────────────────────────────────────────────────
  db:
    profiles: ["prod"]
    image: pgvector/pgvector:pg16
    container_name: doria-profiler-db
    environment:
      POSTGRES_USER: ${DB_USER:-doria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-doria}
      POSTGRES_DB: ${DB_NAME:-doria}
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-doria} -d ${DB_NAME:-doria}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Service API — proxy Node Express + persistance PG (projets, catégories, ancres)
  # Pas exposé publiquement : seul `web` y accède via le réseau Docker interne.
  # ─────────────────────────────────────────────────────────────────────────
  api:
    profiles: ["prod"]
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: doria-profiler-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: "3001"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-doria}
      DB_PASSWORD: ${DB_PASSWORD:-doria}
      DB_NAME: ${DB_NAME:-doria}
    expose:
      - "3001"
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Service EMBED — sentence-transformers (Solon FR) pour la classification
  # locale par similarité cosinus. Pas exposé publiquement.
  # ─────────────────────────────────────────────────────────────────────────
  embed:
    profiles: ["prod"]
    build:
      context: ./embed
      dockerfile: Dockerfile
    container_name: doria-profiler-embed
    expose:
      - "8000"
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Service WEB — bundle Vite servi par nginx
  # Routes :
  #   /api/messages → http://api:3001/api/messages   (proxy Anthropic)
  #   /api/embed/   → http://embed:8000/             (service embeddings)
  # ─────────────────────────────────────────────────────────────────────────
  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doria-profiler-web
    depends_on:
      - api
      - embed
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

# Volumes persistants — `db_data` survit aux down/up et aux rebuilds.
volumes:
  db_data:
